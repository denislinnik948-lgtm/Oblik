<style>
/* Layout: sticky header with section tabs; each section = toolbar + ledger table; forms open in a side sheet */
/* Monochrome: ink on paper, state carried by fill/outline/weight instead of hue */
:root{
  --bg:#F5F5F5; --surface:#FFFFFF; --sunken:#EFEFEF; --zebra:#FAFAFA; --ink:#111111; --muted:#6B6B6B; --line:#DEDEDE; --line-strong:#BDBDBD;
  --accent:#111111; --accent-ink:#FFFFFF; --accent-soft:#EDEDED; --bar2:#C8C8C8;
  --pos:#111111; --neg:#111111; --warn:#111111; --warn-soft:#EDEDED; --neg-soft:#111111; --pos-soft:#FFFFFF;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0D0D; --surface:#161616; --sunken:#202020; --zebra:#1A1A1A; --ink:#F2F2F2; --muted:#9A9A9A; --line:#2E2E2E; --line-strong:#4A4A4A;
  --accent:#F2F2F2; --accent-ink:#0D0D0D; --accent-soft:#242424; --bar2:#4F4F4F;
  --pos:#F2F2F2; --neg:#F2F2F2; --warn:#F2F2F2; --warn-soft:#2A2A2A; --neg-soft:#F2F2F2; --pos-soft:#161616; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0D0D; --surface:#161616; --sunken:#202020; --zebra:#1A1A1A; --ink:#F2F2F2; --muted:#9A9A9A; --line:#2E2E2E; --line-strong:#4A4A4A;
  --accent:#F2F2F2; --accent-ink:#0D0D0D; --accent-soft:#242424; --bar2:#4F4F4F;
  --pos:#F2F2F2; --neg:#F2F2F2; --warn:#F2F2F2; --warn-soft:#2A2A2A; --neg-soft:#F2F2F2; --pos-soft:#161616; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px 4px}
.brand{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:-.01em;margin:0}
.brand small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);margin-left:8px;letter-spacing:0}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--pos)} .sync.bad i{background:var(--neg)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{all:unset;cursor:pointer;padding:10px 12px 11px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}

nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
main{padding-block:20px 60px}
h2{font-family:var(--f-display);font-weight:500;font-size:20px;margin:0;text-wrap:balance}

/* tables */
.tw{overflow:auto;max-height:max(340px,calc(100vh - 230px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:0;border-bottom:1px solid var(--line-strong);background:var(--sunken);white-space:nowrap;position:sticky;top:0;z-index:2}
.t th.n{text-align:right}
.sortb{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:6px;align-items:center;width:100%;padding:11px 12px}
th.n .sortb{justify-content:flex-end}
.sortb:hover{color:var(--ink)}
.sortb:focus-visible{outline:2px solid var(--ink);outline-offset:-3px;border-radius:4px}
.sortb .arr{font-size:11px;opacity:.3;width:.8em;text-align:center}
th[aria-sort="ascending"],th[aria-sort="descending"]{color:var(--ink)}
th[aria-sort="ascending"] .arr,th[aria-sort="descending"] .arr{opacity:1}
.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;background:var(--surface)}
.t th:first-child,.t td:first-child{position:sticky;left:0;z-index:1;box-shadow:1px 0 0 var(--line)}
.t thead th:first-child{z-index:3}
.t tbody tr:nth-child(even) td{background:var(--zebra)}

.t tfoot td{font-weight:700;border-top:1px solid var(--ink);padding:11px 12px;background:var(--sunken);position:sticky;bottom:0;white-space:nowrap}
.sku{font-weight:600;font-size:13px;letter-spacing:.02em}
.sub{display:block;color:var(--muted);font-size:12.5px}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap;border:1px solid var(--ink)}
.chip.ok{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.chip.low{background:var(--warn-soft);color:var(--ink)}
.chip.out{background:var(--ink);color:var(--bg)}
.chip.demo{background:transparent;color:var(--muted);border:1px dashed var(--line-strong)}
.cm{position:relative}
.cm-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:8;background:var(--surface);border:1px solid var(--ink);border-radius:var(--r);padding:6px;width:250px;max-width:calc(100vw - 32px);max-height:60vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column}
.cm-pop label{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:6px;cursor:pointer;font-size:14px}

.cm-pop input{width:16px;height:16px;accent-color:var(--ink);margin:0}
.cm-f{display:flex;justify-content:space-between;gap:6px;border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.cm-f .btn{padding:6px 8px;font-size:13px}
.count{font-size:13px;color:var(--muted)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.warnlist{margin:0;padding-left:18px;font-size:13.5px}
.warnlist li{margin-bottom:4px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:20;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(720px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 14px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:17px;flex:1}
.sheet-b{flex:1;overflow-y:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) 18px 18px;display:flex;flex-direction:column;gap:16px}
.sheet-f{display:flex;gap:10px;flex-wrap:wrap;padding:12px max(18px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) 18px;background:var(--surface);border-top:1px solid var(--line)}
.sheet-f .sp{flex:1}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.lines{display:flex;flex-direction:column;gap:10px}
.line{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;align-items:end}
.line .wide{grid-column:1/-1}
.line .x{justify-self:end}

.calc b{font-variant-numeric:tabular-nums}

.hint.w{font-weight:600}
details.help{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-top:22px;font-size:14px}
details.help summary{cursor:pointer;font-weight:600}

@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

<header>
  <div class="wrap">
    <div class="top">
      <h1 class="brand">Облік магазину<small>гривні · середньозважена собівартість</small></h1>
      <div class="sync" id="sync"><i></i><span>Підключення…</span></div>
    </div>
    <nav role="tablist" id="tabs">
      <button role="tab" data-tab="summary" aria-selected="true">Зведення</button>
      <button role="tab" data-tab="orders">Продажі</button>
      <button role="tab" data-tab="purchases">Закупівлі</button>
      <button role="tab" data-tab="products">Товари</button>
      <button role="tab" data-tab="kits">Набори</button>
      <button role="tab" data-tab="expenses">Витрати</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div id="sheetRoot"></div>

<script>
"use strict";
const COLS=["products","kits","purchases","orders","expenses"];
const S={products:[],kits:[],purchases:[],orders:[],expenses:[]};
let db=null, canWrite=true, tab="summary", period="all", C=null, firstLoad=new Set(), dl=null;
const ui={q:{},lowOnly:false};
const EXP_CATS=["Реклама","Сервіси та підписки","Пакування для складу","Банк та еквайринг","Оренда","Зарплата","Податки","Інше"];

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=new Intl.NumberFormat("uk-UA",{minimumFractionDigits:2,maximumFractionDigits:2});
const nq=new Intl.NumberFormat("uk-UA",{maximumFractionDigits:2});
const money=v=>nf.format(Math.round((+v||0)*100)/100)+" ₴";
const qty=v=>nq.format(+v||0);
const pct=v=>isFinite(v)?nq.format(Math.round(v*10)/10)+"%":"—";
const num=v=>{const n=parseFloat(String(v??"").replace(/\s/g,"").replace(",","."));return isFinite(n)?n:0};
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>d?d.split("-").reverse().join("."):"";
const MONTHS=["січень","лютий","березень","квітень","травень","червень","липень","серпень","вересень","жовтень","листопад","грудень"];
const monthName=m=>{const[y,mm]=m.split("-");return MONTHS[+mm-1]+" "+y};
const signCls=v=>v<0?"neg":v>0?"pos":"";

/* ---------- розрахунки ---------- */
function compute(){
  const P={},K={};
  for(const p of S.products)P[p.id]={...p,buys:[],bought:0,buyCost:0,sold:0,returned:0,revenue:0,profit:0,soldDirect:0};
  for(const k of S.kits)K[k.id]={...k,sold:0,revenue:0,profit:0};
  const warnings=[];
  // закупівлі: доставка партії ділиться пропорційно вартості товару
  for(const b of S.purchases){
    const lines=b.lines||[];
    const goods=lines.reduce((s,l)=>s+num(l.qty)*num(l.price),0);
    const tq=lines.reduce((s,l)=>s+num(l.qty),0);
    b._total=0;b._qty=tq;
    for(const l of lines){
      const base=num(l.qty)*num(l.price);
      const share=goods>0?base/goods:(tq?num(l.qty)/tq:0);
      const cost=base+num(l.extra)+num(b.shipping)*share;
      b._total+=cost;
      const p=P[l.productId];
      if(p){p.buys.push({date:b.date||"",qty:num(l.qty),cost});p.bought+=num(l.qty);p.buyCost+=cost}
    }
  }
  for(const p of Object.values(P)){p.buys.sort((a,b)=>a.date<b.date?-1:1);p.avg=p.bought?p.buyCost/p.bought:0}
  // собівартість на дату продажу = закуплене до цієї дати включно / кількість
  const avgAt=(pid,date)=>{
    const p=P[pid];if(!p)return 0;let q=0,c=0;
    for(const x of p.buys){if(x.date>date)break;q+=x.qty;c+=x.cost}
    return q?c/q:p.avg;
  };
  for(const o of S.orders){
    o._rev=0;o._refund=0;o._cogs=0;o._ret=0;
    const ls=(o.lines||[]).map(l=>{
      const kit=l.kind==="kit";
      const comps=kit?(l.components||K[l.refId]?.components||[]):[{productId:l.refId,qty:1}];
      const q=num(l.qty),r=Math.min(num(l.returned),q);
      const unitCost=comps.reduce((s,c)=>s+num(c.qty)*avgAt(c.productId,o.date||""),0);
      for(const c of comps){
        const p=P[c.productId];
        if(p){p.sold+=num(c.qty)*q;p.returned+=num(c.qty)*r;if(!kit)p.soldDirect+=q;
          if(p.buys.length&&o.date&&o.date<p.buys[0].date)warnings.push(`Продаж ${o.number||""} від ${fmtDate(o.date)}: ${p.sku} продано раніше за першу закупівлю (${fmtDate(p.buys[0].date)}). Собівартість взято середню за весь час.`)}
      }
      const rev=q*num(l.price)-num(l.discount),refund=num(l.refund),cogs=unitCost*(q-r);
      o._rev+=rev;o._refund+=refund;o._cogs+=cogs;o._ret+=r;
      return{l,kit,rev,refund,cogs};
    });
    o._extra=num(o.commission)+num(o.shipCost);
    o._net=o._rev-o._refund;
    o._profit=o._net-o._cogs-o._extra;
    for(const x of ls){
      const share=o._rev>0?x.rev/o._rev:(ls.length?1/ls.length:0);
      const pr=x.rev-x.refund-x.cogs-o._extra*share;
      const tgt=x.kit?K[x.l.refId]:P[x.l.refId];
      if(tgt){tgt.revenue+=x.rev-x.refund;tgt.profit+=pr;if(x.kit)tgt.sold+=num(x.l.qty)}
    }
  }
  for(const p of Object.values(P)){
    p.stock=p.bought-p.sold+p.returned;
    p.value=Math.max(p.stock,0)*p.avg;
    p.status=p.stock<=0?"out":p.stock<=num(p.minStock)?"low":"ok";
    if(p.stock<0)warnings.push(`${p.sku}: залишок від'ємний (${qty(p.stock)} шт.). Ймовірно, не внесена закупівля.`);
  }
  for(const k of Object.values(K)){
    const comps=k.components||[];
    k.cost=comps.reduce((s,c)=>s+num(c.qty)*(P[c.productId]?.avg||0),0);
    k.canBuild=comps.length?Math.max(0,Math.min(...comps.map(c=>num(c.qty)?Math.floor((P[c.productId]?.stock||0)/num(c.qty)):Infinity))):0;
    if(!isFinite(k.canBuild))k.canBuild=0;
  }
  return{P,K,avgAt,warnings:[...new Set(warnings)]};
}
const inPeriod=d=>period==="all"||(d||"").startsWith(period);

function periodTotals(pred){
  const t={orders:0,rev:0,refund:0,cogs:0,commission:0,ship:0,expenses:0,purchases:0,units:0};
  for(const o of S.orders)if(pred(o.date)){t.orders++;t.rev+=o._rev;t.refund+=o._refund;t.cogs+=o._cogs;t.commission+=num(o.commission);t.ship+=num(o.shipCost)}
  for(const e of S.expenses)if(pred(e.date))t.expenses+=num(e.amount);
  for(const b of S.purchases)if(pred(b.date))t.purchases+=b._total;
  t.net=t.rev-t.refund;t.gross=t.net-t.cogs-t.commission-t.ship;t.result=t.gross-t.expenses;
  t.cash=t.net-t.commission-t.ship-t.expenses-t.purchases;
  return t;
}

/* ---------- рендер ---------- */
const name=(pid)=>{const p=S.products.find(x=>x.id===pid);return p?p.sku:"(видалений товар)"};
const kitName=(kid)=>{const k=S.kits.find(x=>x.id===kid);return k?k.sku:"(видалений набір)"};
function render(){
  C=compute();
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  const m=document.getElementById("main");
  const demo=COLS.some(c=>S[c].some(d=>d.demo));
  let h=demo?`<div class="banner"><p><b>Зараз тут приклади даних.</b> Подивіться, як усе рахується, потім видаліть їх і вносьте свої товари.</p>${canWrite?`<button class="btn" id="clearDemo">Видалити приклади</button>`:""}</div>`:"";
  h+=({summary:vSummary,orders:vOrders,purchases:vPurchases,products:vProducts,kits:vKits,expenses:vExpenses})[tab]();
  m.innerHTML=h;
  bindMain();
}
function periodSelect(){
  const ms=new Set();
  for(const c of ["orders","purchases","expenses"])for(const d of S[c])if(d.date)ms.add(d.date.slice(0,7));
  const months=[...ms].sort().reverse(),years=[...new Set(months.map(m=>m.slice(0,4)))];
  return `<select id="period" style="width:auto">
    <option value="all"${period==="all"?" selected":""}>Увесь час</option>
    ${years.map(y=>`<option value="${y}"${period===y?" selected":""}>${y} рік</option>`).join("")}
    ${months.map(m=>`<option value="${m}"${period===m?" selected":""}>${monthName(m)}</option>`).join("")}
  </select>`;
}
function addBtn(label,kind){return canWrite?`<button class="btn primary" data-new="${kind}">${label}</button>`:""}
function searchBox(k,ph){return `<input type="search" id="q_${k}" data-q="${k}" placeholder="${ph}" value="${esc(ui.q[k]||"")}">`}
const match=(k,txt)=>{const q=(ui.q[k]||"").trim().toLowerCase();return !q||txt.toLowerCase().includes(q)};

    <div class="kpi"><span>Інші витрати</span><b>${money(t.expenses)}</b><em>реклама, сервіси, оренда…</em></div>
    <div class="kpi main"><span>Чистий результат</span><b class="${signCls(t.result)}">${money(t.result)}</b><em>прибуток − витрати</em></div>
    <div class="kpi"><span>Товар на складі</span><b>${money(stockVal)}</b><em>${qty(stockUnits)} шт. за собівартістю</em></div>

    <div style="display:flex;flex-direction:column;gap:22px;min-width:0">
      <div class="panel"><h3>Звіт про прибуток${period==="all"?"":" · "+esc(period.length===4?period+" рік":monthName(period))}</h3>
        <table class="pl">

          <tr><td class="ind">− повернення грошей покупцям</td><td class="num">${money(-t.refund)}</td></tr>

    <p>Закупівля не є витратою одразу: у прибуток потрапляє собівартість лише проданих одиниць, решта лишається товаром на складі.</p>
    <p>Набір при продажі списує свої компоненти зі складу. Склад набору запам'ятовується в кожному продажі, тож якщо ви пізніше зміните набір, старі продажі не перерахуються.</p>
    <p>Повернення: вкажіть у продажі, скільки одиниць повернулось на склад і скільки грошей повернули. Повернені одиниці знову з'являються в залишку, а їх собівартість знімається з продажу.</p>
  </details>`;
}
function chart(){
  const ms=new Set();
  for(const c of ["orders","expenses"])for(const d of S[c])if(d.date)ms.add(d.date.slice(0,7));
  const months=[...ms].sort().slice(-12);
  if(!months.length)return `<p class="hint">Тут з'явиться графік, коли будуть продажі.</p>`;
  const rows=months.map(m=>({m,...periodTotals(d=>(d||"").startsWith(m))}));
  const max=Math.max(1,...rows.map(r=>Math.max(r.net,r.result,0))),min=Math.min(0,...rows.map(r=>r.result));
  const W=620,H=220,pl=58,pb=26,pt=8,ih=H-pb-pt,iw=W-pl-8;
  const y=v=>pt+ih*(max-v)/(max-min);
  const step=iw/months.length,bw=Math.min(22,step*.34);
  const ticks=[0,max/2,max];if(min<0)ticks.push(min);
  const short=v=>Math.abs(v)>=1000?nq.format(Math.round(v/100)/10)+"к":nq.format(Math.round(v));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Виручка і чистий результат по місяцях"><defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--surface)"/><line x1="0" y1="0" x2="0" y2="5" stroke="var(--ink)" stroke-width="2"/></pattern></defs>`;
  for(const t of ticks)s+=`<line x1="${pl}" x2="${W-8}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${short(t)}</text>`;
  rows.forEach((r,i)=>{
    const cx=pl+step*i+step/2;
    const b1=y(Math.max(r.net,0)),b2=y(Math.max(r.result,0)),b2b=y(Math.min(r.result,0));
    s+=`<rect x="${cx-bw-1}" y="${b1}" width="${bw}" height="${Math.max(0,y(0)-b1)}" fill="var(--bar2)" rx="2"><title>${monthName(r.m)}: виручка ${money(r.net)}</title></rect>`;
    s+=`<rect x="${cx+1}" y="${b2}" width="${bw}" height="${Math.max(0,b2b-b2)}" fill="${r.result<0?"url(#hatch)":"var(--ink)"}" stroke="var(--ink)" stroke-width="${r.result<0?1:0}" rx="2"><title>${monthName(r.m)}: чистий результат ${money(r.result)}</title></rect>`;
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${MONTHS[+r.m.slice(5)-1].slice(0,3)}</text>`;
  });
  return s+`</svg><div class="legend"><span><i style="background:var(--bar2)"></i>Виручка</span><span><i style="background:var(--ink)"></i>Чистий результат</span><span><i style="background:repeating-linear-gradient(45deg,var(--ink) 0 2px,var(--surface) 2px 4px);outline:1px solid var(--ink)"></i>Збиток</span></div>`;
}
/* ---------- таблиці: сортування й вибір колонок, стан пам'ятається в браузері ---------- */
const TBL={};
function tblState(id){
  ui.tbl=ui.tbl||{};
  if(!ui.tbl[id]){let s=null;try{s=JSON.parse(localStorage.getItem("tbl:"+id)||"null")}catch(_){}ui.tbl[id]=s||{hidden:null,sort:null}}
  return ui.tbl[id];
}
function saveTbl(id){try{localStorage.setItem("tbl:"+id,JSON.stringify(ui.tbl[id]))}catch(_){}}
function hiddenOf(id){const st=tblState(id);return new Set(st.hidden??TBL[id].cols.filter(c=>c.off).map(c=>c.key))}
const cellFmt={money:v=>money(v),qty:v=>qty(v),pct:v=>pct(v),date:v=>fmtDate(v),text:v=>esc(v)};
const isNumCol=c=>c.f&&c.f!=="text"&&c.f!=="date";
const demoChip=r=>r.demo?' <span class="chip demo">приклад</span>':"";
function table(id,kind,cols,rows,opt={}){
  TBL[id]={cols};
  const st=tblState(id),hid=hiddenOf(id),vis=cols.filter(c=>!hid.has(c.key));
  const sort=st.sort||opt.sort;
  if(sort){const c=cols.find(c=>c.key===sort.key);if(c){const d=sort.dir==="asc"?1:-1;rows=[...rows].sort((a,b)=>{
    const x=c.v(a),y=c.v(b);
    if(!isNumCol(c))return String(x??"").localeCompare(String(y??""),"uk",{numeric:true})*d;
    const nx=isFinite(x)?+x:-Infinity,ny=isFinite(y)?+y:-Infinity;return(nx===ny?0:nx<ny?-1:1)*d})}}
  const th=c=>{const on=sort&&sort.key===c.key;
    return `<th class="${isNumCol(c)?"n":""}" aria-sort="${on?(sort.dir==="asc"?"ascending":"descending"):"none"}"><button class="sortb" data-sort="${id}" data-key="${c.key}" title="Сортувати">${esc(c.label)}<span class="arr">${on?(sort.dir==="asc"?"↑":"↓"):"↕"}</span></button></th>`};
  const td=(c,r)=>{const v=c.v(r);return `<td class="${isNumCol(c)?"n":""}${c.sign&&v<0?" neg":""}">${c.h?c.h(r):cellFmt[c.f||"text"](v)}</td>`};
  let foot="";
  if(vis.some(c=>c.total))foot=`<tfoot><tr>${vis.map((c,i)=>{
    if(c.total){const s=rows.reduce((a,r)=>a+(+c.v(r)||0),0);return `<td class="n${c.sign&&s<0?" neg":""}">${cellFmt[c.f](s)}</td>`}
    return `<td>${i===0?`Разом · ${rows.length}`:""}</td>`}).join("")}</tr></tfoot>`;
  return `<div class="tw"><table class="t"><thead><tr>${vis.map(th).join("")}</tr></thead><tbody>${rows.map(r=>`<tr class="click" tabindex="0" data-edit="${kind}" data-id="${r.id}">${vis.map(c=>td(c,r)).join("")}</tr>`).join("")}</tbody>${foot}</table></div>`;
}
function colsBtn(id){
  if(!TBL[id])return "";
  const cols=TBL[id].cols,hid=hiddenOf(id),open=ui.colMenu===id;
  return `<div class="cm"><button class="btn" data-colmenu="${id}" aria-expanded="${open}" aria-haspopup="true">Колонки <span class="mut">${cols.length-hid.size}/${cols.length}</span></button>${open?`<div class="cm-pop">${cols.map(c=>`<label><input type="checkbox" data-col="${id}" data-key="${c.key}"${hid.has(c.key)?"":" checked"}>${esc(c.label)}</label>`).join("")}<div class="cm-f"><button class="btn ghost" data-colreset="${id}">Як за замовчуванням</button><button class="btn ghost" data-colall="${id}">Усі</button></div></div>`:""}</div>`;
}
function listView(title,id,kind,cols,rows,{search,period:per=true,add,empty,sort,total}){
  const tbl=rows.length?table(id,kind,cols,rows,{sort}):"";
  if(!rows.length)TBL[id]={cols};
  return `<div class="bar"><h2 class="grow">${title}${total!=null?` <span class="count">· ${total}</span>`:""}</h2>${searchBox(id,search)}${per?periodSelect():""}${colsBtn(id)}${add||""}</div>${tbl||emptyBox(...empty)}`;
}

    };
  });
  root.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{d[arr].splice(+b.dataset.del,1);if(!d[arr].length)d[arr].push({...blankLine[F.kind]});drawSheet()});
  const al=root.querySelector("#addLine");if(al)al.onclick=()=>{d[arr].push({...blankLine[F.kind]});drawSheet()};
  const del=root.querySelector("#delS");if(del)del.onclick=async()=>{
    if(F.kind==="product"&&usedProduct(F.id)){F.err="Цей товар є в закупівлях, продажах або наборах. Спершу видаліть ці записи, інакше розрахунки зламаються.";drawSheet();return}
    if(del.dataset.sure!=="1"){del.dataset.sure="1";del.textContent="Точно видалити?";return}
    del.disabled=true;
    try{await db.collection(F.col).doc(F.id).delete();closeSheet()}catch(e){F.err="Не вдалося видалити: "+(e.message||e.code);drawSheet()}
  };
  const sv=root.querySelector("#saveS");if(sv)sv.onclick=save;
  root.onkeydown=e=>{if(e.key==="Escape")closeSheet()};
}
function usedProduct(pid){
  return S.purchases.some(b=>(b.lines||[]).some(l=>l.productId===pid))||S.orders.some(o=>(o.lines||[]).some(l=>l.refId===pid||(l.components||[]).some(c=>c.productId===pid)))||S.kits.some(k=>(k.components||[]).some(c=>c.productId===pid));
}
async function save(){
  const d=JSON.parse(JSON.stringify(F.data)),k=F.kind;let err="";
  const N=["minStock","price","amount","shipping","commission","shipCost"];
  for(const x of N)if(x in d)d[x]=num(d[x]);
  if(k==="product"){
    d.sku=(d.sku||"").trim();d.name=(d.name||"").trim();
    if(!d.sku||!d.name)err="Вкажіть SKU і назву.";
    else if(S.products.some(p=>p.id!==F.id&&(p.sku||"").toLowerCase()===d.sku.toLowerCase()))err=`SKU ${d.sku} вже є. Кожен товар має мати свій SKU.`;
  }
  if(k==="kit"){
    d.sku=(d.sku||"").trim();d.components=d.components.filter(c=>c.productId).map(c=>({productId:c.productId,qty:num(c.qty)}));
    if(!d.sku||!d.name)err="Вкажіть SKU і назву набору.";else if(!d.components.length)err="Додайте хоча б один товар у набір.";
    else if(d.components.some(c=>c.qty<=0))err="Кількість кожного компонента має бути більшою за нуль.";
  }
  if(k==="purchase"){
    d.lines=d.lines.filter(l=>l.productId).map(l=>({productId:l.productId,qty:num(l.qty),price:num(l.price),extra:num(l.extra)}));
    if(!d.date)err="Вкажіть дату.";else if(!d.lines.length)err="Оберіть хоча б один товар.";else if(d.lines.some(l=>l.qty<=0))err="Кількість має бути більшою за нуль.";
  }
  if(k==="order"){
    d.lines=d.lines.filter(l=>l.refId).map(l=>{
      const o={kind:l.kind||"product",refId:l.refId,qty:num(l.qty),price:num(l.price),discount:num(l.discount),returned:num(l.returned),refund:num(l.refund)};
      if(o.kind==="kit")o.components=l.components||(S.kits.find(x=>x.id===l.refId)?.components||[]).map(c=>({productId:c.productId,qty:num(c.qty)}));
      return o;
    });
    if(!d.date)err="Вкажіть дату.";else if(!d.lines.length)err="Оберіть хоча б один товар або набір.";
    else if(d.lines.some(l=>l.qty<=0))err="Кількість має бути більшою за нуль.";
    else if(d.lines.some(l=>l.returned>l.qty))err="Повернуто не може бути більше, ніж продано.";
  }
  if(k==="expense"&&(!d.date||!d.amount||!(d.category||"").trim()))err="Вкажіть дату, категорію і суму.";
  if(err){F.err=err;drawSheet();return}
  for(const x of Object.keys(d))if(x.startsWith("_")||x==="id")delete d[x];
  if(F.id&&S[F.col].find(x=>x.id===F.id)?.demo)d.demo=true;
  const btn=document.getElementById("saveS");if(btn){btn.disabled=true;btn.textContent="Зберігаю…"}
  try{
    const ref=F.id?db.collection(F.col).doc(F.id):db.collection(F.col).doc();
    await ref.set(d);closeSheet();
  }catch(e){
    if(e.code==="invalid_argument"&&!F.id){canWrite=false;F.err="У вас немає прав змінювати дані. Попросіть власника дати доступ «Contributor» або вище."}
    else F.err=e.code==="quota_exceeded"?"Базу заповнено. Видаліть старі записи.":"Не вдалося зберегти ("+(e.code||"помилка")+"). Спробуйте ще раз.";
    drawSheet();
  }
}

/* ---------- експорт ---------- */
async function exportXlsx(){
  const btn=document.getElementById("export");
  if(typeof XLSX==="undefined"){btn.textContent="Бібліотека Excel не завантажилась";return}
  const r2=v=>Math.round((+v||0)*100)/100,wb=XLSX.utils.book_new();
  const add=(nm,rows)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),nm);
  const t=periodTotals(()=>true);
  add("Зведення",[["Виручка",t.net],["Собівартість проданого",t.cogs],["Комісії",t.commission],["Доставка за рахунок магазину",t.ship],["Прибуток від продажів",t.gross],["Інші витрати",t.expenses],["Чистий результат",t.result]].map(([a,b])=>({"Показник":a,"Сума, грн":r2(b)})));
  add("Товари",Object.values(C.P).map(p=>({"SKU":p.sku,"Назва":p.name,"Категорія":p.category,"Постачальник":p.supplier,"Ціна продажу":r2(p.price),"Мін. залишок":p.minStock,"Закуплено":p.bought,"Продано":p.sold,"Повернено":p.returned,"Залишок":p.stock,"Сер. собівартість":r2(p.avg),"Вартість залишку":r2(p.value),"Прибуток":r2(p.profit)})));
  add("Закупівлі",S.purchases.flatMap(b=>(b.lines||[]).map(l=>({"Дата":b.date,"Партія":b.batch,"Постачальник":b.supplier,"SKU":name(l.productId),"Кількість":l.qty,"Ціна":l.price,"Дод. витрати":l.extra,"Доставка партії":b.shipping,"Примітка":b.note}))));
  add("Продажі",S.orders.flatMap(o=>(o.lines||[]).map((l,i)=>({"Дата":o.date,"Замовлення":o.number,"Канал":o.channel,"Тип":l.kind==="kit"?"набір":"товар","SKU":l.kind==="kit"?kitName(l.refId):name(l.refId),"Кількість":l.qty,"Ціна":l.price,"Знижка":l.discount,"Повернуто, шт":l.returned,"Повернуто, грн":l.refund,"Комісія (замовл.)":i?"":o.commission,"Доставка (замовл.)":i?"":o.shipCost,"Прибуток (замовл.)":i?"":r2(o._profit),"Примітка":o.note}))));
  add("Набори",S.kits.flatMap(k=>(k.components||[]).map(c=>({"SKU набору":k.sku,"Назва":k.name,"Ціна":k.price,"Компонент":name(c.productId),"Кількість":c.qty}))));
  add("Витрати",S.expenses.map(e=>({"Дата":e.date,"Категорія":e.category,"Сума":e.amount,"Коментар":e.note})));
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  try{await dl.save({filename:`oblik-${today()}.xlsx`,data:buf})}catch(e){if(e.code!=="declined")btn.textContent="Не вдалося зберегти файл"}
}

/* ---------- запуск ---------- */
function setSync(cls,txt){const s=document.getElementById("sync");s.className="sync "+cls;s.querySelector("span").textContent=txt}
try{const t=localStorage.getItem("tab");if(t&&document.querySelector(`#tabs [data-tab="${t}"]`))tab=t}catch(_){}
render();
(async()=>{
  if(!window.claude?.use){setSync("bad","Відкрийте сторінку в Claude, щоб зберігати дані");return}
  db=await claude.use("db");
  if(!db){setSync("bad","Сховище недоступне. Увійдіть у свій акаунт");return}
  claude.use("downloads").then(d=>{dl=d;if(tab==="expenses")render()});
  claude.use("user").then(async u=>{if(!u)return;const c=await u.can("data.write");if(c===false){canWrite=false;render()}});
  const timer=setTimeout(()=>setSync("bad","Дані поки недоступні, перевірте з'єднання"),10000);
  let pending=false;
  for(const c of COLS){
    db.collection(c).onSnapshot(snap=>{
      S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));
      if(!snap.metadata.fromCache)firstLoad.add(c);
      if(firstLoad.size===COLS.length){clearTimeout(timer);setSync("ok","Збережено")}
      if(!pending){pending=true;requestAnimationFrame(()=>{pending=false;render();if(F)drawSheet()})}
    },e=>{clearTimeout(timer);setSync("bad","Помилка зв'язку зі сховищем ("+e.code+")")});
  }
})();
</script>
